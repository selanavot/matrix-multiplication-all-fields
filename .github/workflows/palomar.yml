name: Palomar full preflight
on:
  workflow_dispatch:
  push:
    branches: [packaging/palomar]
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check-specification.py
      - run: git diff --check HEAD^ HEAD
  proof-check:
    needs: source-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Free disk space for the clean build
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Install pinned elan and the project toolchain
        run: |
          curl --fail --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: bash scripts/bootstrap.sh
      - name: Build the proof and replay its full imported environment
        run: bash scripts/check-kernel.sh
      - name: Check six claims and both rejection controls
        run: python3 scripts/check-comparator.py --trusted-local --negative-controls
  verify:
    needs: proof-check
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: allfields001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","formalization_metadata_path":"formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
